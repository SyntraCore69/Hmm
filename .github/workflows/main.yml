name: Build Laava Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.0.5'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Clean Flutter project
        run: flutter clean

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Fix legacy ExoPlayer dependency for CI
        run: |
          find "$HOME/.pub-cache" \
            -path "*/cached_video_player-2.0.3/android/build.gradle" \
            -exec sed -i 's/2\.12\.1/2.13.3/g' {} \;

          echo "Checking cached_video_player Gradle file:"
          find "$HOME/.pub-cache" \
            -path "*/cached_video_player-2.0.3/android/build.gradle" \
            -exec grep -n "exoplayer" {} \;

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Laava Chat APK
        uses: actions/upload-artifact@v4
        with:
          name: Laava-Chat-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
